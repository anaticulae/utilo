[build-system]
requires = [
    "setuptools>=84.0.0",
    "wheel>=0.48.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "utilo"
version = "2.110.1"
description = ""
requires-python = ">=3.12"
authors = [
    { name = "Helmut Konrad Schewe", email = "helmutus@outlook.com" },
]
dependencies = [
    "utilosafe>=1.0.0,<2.0.0",
]
keywords = []
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
license = "MIT"
license-files = [
    "LICENSE",
]

[project.readme]
file = "README"
content-type = "text/markdown"

[project.scripts]
utilo_lock = "utilo.xyz.lock:main"
utilo_unlock = "utilo.xyz.lock:unlock"
utilo_table = "utilo.xyz.table:main"
utilo_tidy = "utilo.xyz.tidy:main"

[project.optional-dependencies]
dev = [
    "PyYAML>=6.0.3,<7.0.0",
    "pytest-timeout>=2.4.0,<3.0.0",
    "utilotest>=1.0.5,<2.0.0",
    "iamraw>=4.95.0,<5.0.0",
]

[project.urls]
Homepage = "https://github.com/anaticulae/utilo"
Repository = "https://github.com/anaticulae/utilo"

[tool.semantic_release]
version_toml = [
    "pyproject.toml:project.version",
]

[tool.semantic_release.changelog]
mode = "init"
output_format = "md"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG"

[tool.semantic_release.commit_parser_options]
patch_tags = [
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "fix",
    "perf",
    "refactor",
    "style",
    "test",
]
minor_tags = [
    "feat",
]

[tool.setuptools.packages.find]
where = [
    ".",
]
include = [
    "utilo",
    "utilo.classifier",
    "utilo.cli",
    "utilo.feature",
    "utilo.file",
    "utilo.math",
    "utilo.string",
    "utilo.xyz",
]
exclude = [
    "tests*",
]
